name: CI
on: [push]
permissions:
  contents: read
jobs:
  main:
    name: pnpm commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set Node.js version
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Install pnpm
        uses: pnpm/setup@v2
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Format check
        run: pnpm run format:check
